# mode: single or training
mode=training

# number of generated sets (single mode: number of images)
set.count=2
output.dir=output

# optional seed (empty means non-deterministic)
seed=12345

# image size per cell
cell.size=1024

# grid size for puzzle image
grid.rows=10
grid.cols=10

# number of placed gabor images in puzzle (must be even)
training.image.count=12
